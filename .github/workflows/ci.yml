name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src/shared is a copy of the backend's packages/shared (scripts/sync-shared.mjs); the
      # drift check runs locally where ../backend exists and is skipped here.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (WEB-001)
        run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (low-end Android profile, Slow 3G budget)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Lighthouse CI (accessibility ≥ 95)
        run: npx --yes @lhci/cli@0.15.1 autorun
