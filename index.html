<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The bank's cyan; the PWA is light only (MOB-005). -->
    <meta name="theme-color" content="#00ADEF" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Nota: your dube book with your shops" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nota" />
    <!-- WEB-001: the subset Ethiopic font is preloaded; system fonts cover the rest. -->
    <link
      rel="preload"
      href="/fonts/noto-sans-ethiopic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Nota · ኖታ</title>
    <style>
      /* Paint the paper colour before any script or stylesheet arrives (Slow 3G). */
      html {
        background: #f3f8fb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Nota needs JavaScript. · ኖታ JavaScript ያስፈልገዋል።</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
