<html lang="am">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E6A52" media="(prefers-color-scheme: light)" />

      rel="preload"
      href="/fonts/noto-sans-ethiopic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

        background: #f4f7f2;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #101917;
        }
      }
